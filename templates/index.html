<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>❤️ Heart Disease Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; text-align: center; padding: 20px; }
        h1 { color: #d9534f; }
        form { background: white; padding: 20px; border-radius: 10px; display: inline-block; }
        input, select { margin: 5px; padding: 8px; width: 200px; }
        button { background: #d9534f; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #c9302c; }
        .result { margin-top: 20px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>❤️ Heart Disease Prediction</h1>
    <form action="/predict" method="post">
        <input type="number" name="age" placeholder="Age" required><br>
        <select name="sex">
            <option value="1">Male</option>
            <option value="0">Female</option>
        </select><br>
        <input type="number" name="cp" placeholder="Chest Pain Type (0-3)" required><br>
        <input type="number" name="trestbps" placeholder="Resting BP" required><br>
        <input type="number" name="chol" placeholder="Cholesterol" required><br>
        <input type="number" name="fbs" placeholder="Fasting Blood Sugar (0/1)" required><br>
        <input type="number" name="restecg" placeholder="Rest ECG (0-2)" required><br>
        <input type="number" name="thalach" placeholder="Max Heart Rate" required><br>
        <input type="number" name="exang" placeholder="Exercise Angina (0/1)" required><br>
        <input type="number" step="0.1" name="oldpeak" placeholder="ST Depression" required><br>
        <input type="number" name="slope" placeholder="Slope (0-2)" required><br>
        <input type="number" name="ca" placeholder="Major Vessels (0-4)" required><br>
        <input type="number" name="thal" placeholder="Thal (0-2)" required><br>
        <button type="submit">🔍 Predict</button>
    </form>

    {% if prediction_text %}
        <div class="result">{{ prediction_text }}</div>
    {% endif %}
</body>
</html>
